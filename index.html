<!doctype html>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<title>Raw Material Ordering</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: sticky ledger-style top bar with tabs; one working column of panels; POs rendered as white paper sheets. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#16202C; --muted:#5A6777; --line:#D6DDE6;
  --accent:#1C56D0; --accent-ink:#FFFFFF; --accent-soft:#E3EBFB;
  --ok:#1B7348; --ok-soft:#DFF2E7; --warn:#9A5600; --warn-soft:#FAEDD6; --danger:#B42318; --danger-soft:#FCE6E3;
  --paper:#FFFFFF; --paper-ink:#111418; --paper-line:#222;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#161F29; --surface-2:#1B2530; --ink:#E5EAF0; --muted:#94A2B3; --line:#2A3645;
  --accent:#709CFF; --accent-ink:#0A1220; --accent-soft:#1C2B47;
  --ok:#5CC690; --ok-soft:#14302A; --warn:#E8A84D; --warn-soft:#33270F; --danger:#FF7B6C; --danger-soft:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161F29; --surface-2:#1B2530; --ink:#E5EAF0; --muted:#94A2B3; --line:#2A3645;
  --accent:#709CFF; --accent-ink:#0A1220; --accent-soft:#1C2B47;
  --ok:#5CC690; --ok-soft:#14302A; --warn:#E8A84D; --warn-soft:#33270F; --danger:#FF7B6C; --danger-soft:#3A1A17; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.num,td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px 0}
.brand{display:flex;flex-direction:column;padding-bottom:10px}
.brand b{font-family:var(--f-head);font-size:18px;font-weight:700;letter-spacing:.02em}
.brand span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;align-self:flex-end}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;flex-direction:column;gap:4px}
.panel-head p{color:var(--muted);max-width:70ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.f.grow{flex:1 1 220px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
input[type=number]{font-family:var(--f-num);font-size:13px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
td input,td select{width:100%}
td input.num{min-width:84px}
.check{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:13px;padding-bottom:7px}
.check input{width:16px;height:16px;accent-color:var(--accent)}

.btn{font:inherit;font-weight:600;font-size:13px;border-radius:6px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12px}
.icon-btn{font:inherit;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:6px;padding:4px 8px;cursor:pointer}
.icon-btn:hover{color:var(--danger);border-color:var(--line)}
.icon-btn.armed{color:#fff;background:var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th{background:var(--surface-2);text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.grid tbody tr:last-child td{border-bottom:0}
table.grid td.mono{font-family:var(--f-num)}
tr.group td{background:var(--surface-2);font-weight:600;font-family:var(--f-head);font-size:14px;padding-block:8px}
tr.group td .muted{font-family:var(--f-body);font-weight:400;font-size:12px}
tr.tot td{font-weight:600;background:var(--surface-2)}
.matname{font-weight:500}
.spec{font-size:12px;color:var(--muted)}

.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-num);font-size:22px;font-weight:500}
.stat small{color:var(--muted);font-size:12px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  input,select,textarea{font-size:16px}
  .top-in{gap:8px}
  .brand{padding-bottom:4px}
  .who{order:2;margin-left:auto;padding-bottom:4px}
  .who .lab{display:none}
  .top{position:static}
  .brand b{font-size:16px}
  nav.tabs{order:3;flex-basis:100%}
  .panel{padding:14px}
  .stat b{font-size:18px}
  .po-card > header .actions{width:100%}
}

.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.banner p{max-width:85ch}
.note{background:var(--ok-soft);border-radius:var(--r);padding:10px 14px}

.po-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.po-card > header{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:12px 14px}
.po-card .po-no{font-family:var(--f-num);font-size:12px;color:var(--accent);font-weight:500;letter-spacing:.04em}
.po-card.nov{border-color:var(--warn)}
.po-doc-wrap{background:var(--surface-2);border-top:1px solid var(--line);padding:16px;overflow-x:auto}

/* The PO itself: always paper-white, mirrors the Excel PI layout */
.po-doc{background:var(--paper);color:var(--paper-ink);width:820px;max-width:none;margin:0 auto;font-family:Calibri,Carlito,"IBM Plex Sans",Arial,sans-serif;font-size:12.5px;border:1px solid var(--paper-line)}
.po-doc .banner-t{font-size:26px;font-weight:700;text-align:center;padding:16px;border-bottom:1px solid var(--paper-line);letter-spacing:.04em}
.po-doc .grid2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--paper-line)}
.po-doc .grid2 > div{padding:8px 10px}
.po-doc .grid2 > div + div{border-left:1px solid var(--paper-line)}
.po-doc .lbl{font-weight:700}
.po-doc .potitle{font-size:20px;font-weight:700;text-align:center;align-self:center}
.po-doc .kv{display:grid;grid-template-columns:110px 1fr;gap:2px 8px;margin-top:6px}
.po-doc table{border-collapse:collapse;width:100%}
.po-doc th,.po-doc td{border:1px solid var(--paper-line);padding:4px 6px;text-align:left}
.po-doc th{font-weight:700;background:#F1F1F1}
.po-doc td.n,.po-doc th.n{text-align:right;font-variant-numeric:tabular-nums}
.po-doc .foot{display:grid;grid-template-columns:1.4fr 1fr}
.po-doc .foot > div{padding:8px 10px}
.po-doc .foot table td{border:1px solid var(--paper-line)}
.po-doc .sign{display:flex;justify-content:flex-end;padding:30px 10px 10px;font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}

.bom-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.bom-layout{grid-template-columns:minmax(0,1fr)}}
.plist{display:flex;flex-direction:column;gap:4px}
.plist button{font:inherit;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:1px}
.plist button:hover{background:var(--surface-2)}
.plist button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.plist small{color:var(--muted);font-size:12px}
.newmat{border:1px dashed var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media (max-width:420px){.vgrid{grid-template-columns:minmax(0,1fr)}}
.vcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.empty{color:var(--muted);text-align:center;padding:28px}
.hist li{padding:6px 0;border-bottom:1px solid var(--line)}
.hist{list-style:none;margin:0;padding:0}

@media (prefers-reduced-motion:no-preference){.btn,.icon-btn,nav.tabs a{transition:background .12s,color .12s,border-color .12s}}

/* login */
.who{display:flex;align-items:center;gap:10px;padding-bottom:10px;font-size:13px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.gate{min-height:70vh;display:grid;place-items:center}
.gate form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px}
.gate h2{font-size:22px}
.gate input{width:100%;font-size:16px;padding:10px 12px}
.gate .pin{font-family:var(--f-num);letter-spacing:.4em}
.err{color:var(--danger);font-size:13px}
.ulist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px}
.ulist > div{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.ulist > div:last-child{border-bottom:0}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .print-target,.print-target *{visibility:visible}
  .print-target{position:absolute;left:0;top:0;border:0;width:100%}
  .top,#toast{display:none}
}
</style>

<script>

function sha256(ascii){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));const maxWord=Math.pow(2,32);let result='';const words=[];const bitLen=ascii.length*8;
  let hash=[];const k=[];let pc=0;const comp={};
  for(let c=2;pc<64;c++){if(!comp[c]){for(let i=0;i<313;i+=c)comp[i]=c;hash[pc]=(Math.pow(c,.5)*maxWord)|0;k[pc++]=(Math.pow(c,1/3)*maxWord)|0}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(let i=0;i<ascii.length;i++){const j=ascii.charCodeAt(i);if(j>>8)return'';words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((bitLen/maxWord)|0);words[words.length]=bitLen;
  for(let j=0;j<words.length;){const w=words.slice(j,j+=16);const old=hash;hash=hash.slice(0,8);
    for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2];const a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(let i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=(b<16?'0':'')+b.toString(16)}
  return result;
}
const pinHash=(salt,pin)=>{let h=salt+':'+pin;for(let i=0;i<2000;i++)h=sha256(h+salt);return h};
const USER_RE=/^[a-z0-9._-]{2,20}$/;

function migrate(s){
  if(!s||!Array.isArray(s.vendors)||!Array.isArray(s.materials)||!Array.isArray(s.products))throw new Error('This backup is missing vendors, materials or products.');
  s.units=Array.isArray(s.units)&&s.units.length?s.units:seed().units;
  s.settings=Object.assign({nextPO:1,stockDate:today()},s.settings||{});
  s.plan=Object.assign({date:today(),unitId:s.units[0].id,deduct:true,rows:[],overrides:{}},s.plan||{});
  s.plan.overrides=s.plan.overrides||{};
  s.history=s.history||[];
  s.users=Array.isArray(s.users)?s.users:[];
  return s;
}

function specOf(m){const a=[];if(m.gsm)a.push(m.gsm+' GSM');if(m.width)a.push(m.width+' mm');if(m.type)a.push(m.type);if(m.remark)a.push(m.remark);return a.join(' · ')}
function matLabel(m){const s=specOf(m);return m.name+(s?' — '+s:'')}
const isSheet=m=>!!m&&num(m.gsm)>0&&num(m.width)>0;
function perPc(l,m){if(!m)return 0;return isSheet(m)&&num(l.length)>0?num(m.gsm)*num(m.width)/1000*num(l.length):num(l.weight)}
const toUnit=m=>{const u=String(m.unit||'').toUpperCase();return u==='KG'?1000:u==='TON'?1e6:1};
const pcLabel=m=>{const u=String(m?.unit||'').toUpperCase();return u==='KG'||u==='TON'?'g':esc(m?.unit||'')};
function pcGrams(p){return p.lines.reduce((s,l)=>{const m=mat(l.materialId);return s+(m&&toUnit(m)>1?perPc(l,m):0)},0)}
function usedIn(id){return S.products.filter(p=>p.lines.some(l=>l.materialId===id))}

/* ---------- calculation ---------- */
function compute(){
  const req=new Map();
  for(const r of S.plan.rows){
    const p=prod(r.productId);const q=num(r.qty);if(!p||q<=0)continue;
    for(const l of p.lines){
      const m=mat(l.materialId);if(!m)continue;
      const need=q*perPc(l,m)*(1+num(l.wastage)/100)/toUnit(m);
      const e=req.get(m.id)||{req:0,from:new Set()};e.req+=need;e.from.add(p.name);req.set(m.id,e);
    }
  }
  const rows=[...req].map(([id,e])=>{
    const m=mat(id);const stock=S.plan.deduct?num(m.opening):0;
    const net=Math.max(0,e.req-stock);const auto=Math.ceil(net-1e-9);
    const ov=S.plan.overrides[id];const has=ov!==undefined&&ov!==null&&ov!=='';
    const order=has?num(ov):auto;
    return {m,req:e.req,stock,net,auto,order,overridden:has,amount:order*num(m.rate),from:[...e.from]};
  });
  const groups=new Map();
  for(const r of rows){const k=ven(r.m.vendorId)?r.m.vendorId:'';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
  const vg=[...groups].map(([k,rs])=>({vendor:ven(k)||null,rows:rs.sort((a,b)=>matLabel(a.m).localeCompare(matLabel(b.m))),
    total:rs.reduce((s,r)=>s+r.amount,0)}))
    .sort((a,b)=>!a.vendor?1:!b.vendor?-1:a.vendor.name.localeCompare(b.vendor.name));
  let po=num(S.settings.nextPO)||1;
  for(const g of vg){g.lines=g.rows.filter(r=>r.order>0);if(g.vendor&&g.lines.length)g.po=po++}
  return {rows,vg};
}

function poGrid(d){
  const n=Math.max(d.head.length,6);const pad=a=>{const r=a.slice();while(r.length<n)r.push('');return r};
  const right=n-3;const at=(l,lab,val)=>{const r=pad([l]);r[right]=lab;r[right+1]=val;return r};
  const ul=[...lines(d.u.address),`GSTIN/UIN : ${d.u.gstin}`,`PAN/IT No : ${d.u.pan}`,`State Name : ${d.u.state}`];
  const vl=[d.v.name,...lines(d.v.address),d.v.gstin?(d.v.gstin.startsWith('VAT')?d.v.gstin:`GSTIN: ${d.v.gstin}`):'',d.v.state?`State Name : ${d.v.state}`:''].filter(Boolean);
  const dl=[d.u.name,...ul];
  const g=[pad([d.u.name]),pad([]),at(d.u.name,'PURCHASE ORDER',''),at(ul[0]||'','DATE',d.date),at(ul[1]||'','PO Number',d.po)];
  ul.slice(2).forEach(x=>g.push(pad([x])));
  g.push(pad([]));g.push(at('VENDOR','DELIVERY TO',''));
  for(let i=0;i<Math.max(vl.length,dl.length);i++){const r=pad([vl[i]||'']);r[right]=dl[i]||'';g.push(r)}
  g.push(pad([]));g.push(pad(d.head));d.body.forEach(b=>g.push(pad(b)));
  const t=pad(['Total']);t[d.head.length-3]=d.oneUnit?d.totalQty:'';t[d.head.length-1]=d.total;g.push(t);
  g.push(pad([]));
  const sum=[['Subtotal',d.total],['GST','As Applicable'],['Round Off',''],['TOTAL',d.total],['Currency','INR']];
  const left=['TERMS OF SALE AND OTHER COMMENTS',...d.terms.map((x,i)=>`${i+1}. ${x}`)];
  for(let i=0;i<Math.max(left.length,sum.length);i++)g.push(sum[i]?at(left[i]||'',sum[i][0],sum[i][1]):pad([left[i]||'']));
  return g;
}

  <textarea id="bm-paste" rows="7" placeholder="1&#9;Lower Tissue&#9;&#9;9&#9;0.165&#9;0.32&#9;0.4752"></textarea>
  <label class="check"><input id="bm-replace" type="checkbox" checked> Replace this product's current BOM</label>

function parseBOM(text){
  const out=[];const isN=c=>c!==''&&/^-?\d*\.?\d+$/.test(c.replace(/,/g,''));
  for(const raw of String(text).split(/\r?\n/)){
    const cells=raw.split('\t').map(c=>c.trim());
    const ni=cells.findIndex(c=>c&&!isN(c));if(ni<0)continue;
    const name=cells[ni].replace(/\s+/g,' ');
    if(/^(sr\.?\s*no\.?|material name|total)$/i.test(name))continue;
    const nums=cells.slice(ni+1).filter(isN).map(c=>parseFloat(c.replace(/,/g,'')));
    if(!nums.length)continue;
    if(nums.length>=3){const[g,w,l]=nums;const wmm=w<5?w*1000:w;const lm=l>5?l/1000:l;out.push({name,gsm:g,width:+wmm.toFixed(2),length:lm,weight:nums[3]})}
    else out.push({name,weight:nums[nums.length-1]});
  }
  return out;
}
const norm=s=>String(s||'').toLowerCase().replace(/[.\-–()]/g,' ').replace(/\s+/g,' ').trim();
function matchMat(r){
  if(r.gsm){return S.materials.find(m=>norm(m.name)===norm(r.name)&&num(m.gsm)===r.gsm&&num(m.width)===r.width)}
  return S.materials.find(m=>!isSheet(m)&&norm(m.name)===norm(r.name))||S.materials.find(m=>!isSheet(m)&&norm(m.name).split(' ').includes(norm(r.name).split(' ')[0])&&norm(m.name).includes(norm(r.name)));
}

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  const el=e.target,a=el.dataset.act;if(!a)return;
  if(a==='plan-qty'){S.plan.rows[+el.dataset.i].qty=el.value;ui.saved=null;save();renderResults()}
});
document.addEventListener('change',e=>{
  const el=e.target,a=el.dataset.act;if(!a)return;const d=el.dataset;const p=prod(ui.sel);
  switch(a){
    case 'plan-prod':S.plan.rows[+d.i].productId=el.value;break;
    case 'plan-date':S.plan.date=el.value||today();break;
    case 'plan-unit':S.plan.unitId=el.value;break;
    case 'plan-deduct':S.plan.deduct=el.checked;break;
    case 'plan-qty':save();return;
    case 'ov':{if(el.value==='')delete S.plan.overrides[d.id];else S.plan.overrides[d.id]=el.value;save();renderResults();return}
    case 'prod-f':p[d.k]=el.value;break;
    case 'line-mat':p.lines[+d.i].materialId=el.value;break;
    case 'line-f':p.lines[+d.i][d.k]=el.value===''?'':num(el.value);break;
    case 'line-mf':{const m=mat(d.id);if(!m)break;if(d.k==='widthm')m.width=el.value===''?'':String(+(num(el.value)*1000).toFixed(2));else if(d.k==='vendorId'||d.k==='gsm')m[d.k]=el.value.trim();else m[d.k]=num(el.value);break}
    case 'mat-f':{const m=mat(d.id);if(m)m[d.k]=(d.k==='rate'||d.k==='opening')?num(el.value):el.value;save();if(d.k==='name')return;return}
    case 'ven-f':{const v=ven(d.id);if(v)v[d.k]=el.value;save();return}
    case 'unit-f':{const u=S.units.find(x=>x.id===d.id);if(u)u[d.k]=el.value;save();return}
    case 'set-f':S.settings[d.k]=d.k==='nextPO'?(parseInt(el.value)||1):el.value;save();return;
    case 'bk-file':{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bk-in').value=r.result;toast('File loaded. Press Restore to use it.')};r.readAsText(f);return}
    default:return;
  }
  ui.saved=null;save();render();
});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA')return;
  const a=el.dataset.act,d=el.dataset;const p=prod(ui.sel);
  switch(a){
    case 'ex-dismiss':S.example=false;break;
    case 'logout':setMe(null);ui.armed=null;render();return;
    case 'user-add':{if(!isAdmin())return;const n=$('#nu-name').value.trim().toLowerCase(),pin=$('#nu-pin').value.trim(),role=$('#nu-role').value;
      if(!USER_RE.test(n)){toast('Username must be 2–20 letters or numbers.');return}
      if(S.users.some(u=>u.username===n)){toast('That username is already taken.');return}
      if(!PIN_RE.test(pin)){toast('PIN must be 4 to 6 digits.');return}
      S.users.push(makeUser(n,pin,role));toast(`User ${n} added`);break}
    case 'user-pin':{const u=S.users.find(x=>x.id===d.id);if(!u||(!isAdmin()&&u.id!==ME))return;const pin=$('#up-'+u.id).value.trim();
      if(!PIN_RE.test(pin)){toast('PIN must be 4 to 6 digits.');return}
      u.salt=uid()+uid();u.hash=pinHash(u.salt,pin);toast(`PIN changed for ${u.username}`);break}
    case 'user-role':{if(!isAdmin())return;const u=S.users.find(x=>x.id===d.id);if(!u)return;
      if(u.role==='admin'&&S.users.filter(x=>x.role==='admin').length<2){toast('Keep at least one admin.');return}
      u.role=u.role==='admin'?'staff':'admin';break}
    case 'user-del':{if(!isAdmin()||d.id===ME)return;if(!arm('user-'+d.id))return;S.users=S.users.filter(u=>u.id!==d.id);ui.armed=null;break}
    case 'plan-add':S.plan.rows.push({productId:S.products[0]?.id,qty:''});break;
    case 'plan-del':S.plan.rows.splice(+d.i,1);break;
    case 'ov-clear':S.plan.overrides={};break;
    case 'po-toggle':ui.open.has(d.v)?ui.open.delete(d.v):ui.open.add(d.v);renderResults();return;
    case 'po-copy':{const g=findGroup(d.v);if(g)copyPO(g);return}
    case 'po-print':{const g=findGroup(d.v);if(!g)return;ui.open.add(d.v);renderResults();const doc=$('#pod-'+d.v+' .po-doc');doc.classList.add('print-target');window.print();doc.classList.remove('print-target');return}
    case 'save-order':{const {vg}=compute();const pos=vg.filter(g=>g.po);if(!pos.length)return;
      const rec={date:S.plan.date,savedAt:new Date().toISOString(),by:me()?.username||'',unit:unitById(S.plan.unitId).short,
        plan:S.plan.rows.filter(r=>num(r.qty)>0).map(r=>({product:prod(r.productId)?.name||'',qty:num(r.qty)})),
        pos:pos.map(g=>({po:g.po,vendor:g.vendor.name,total:g.lines.reduce((s,r)=>s+r.amount,0),lines:g.lines.map(r=>({material:matLabel(r.m),unit:r.m.unit,qty:r.order,rate:num(r.m.rate)}))}))};
      rec.total=rec.pos.reduce((s,x)=>s+x.total,0);S.history.push(rec);
      const first=pos[0].po,last=pos[pos.length-1].po;S.settings.nextPO=last+1;
      ui.saved=`Saved. PO ${first}${last>first?' to '+last:''} are now used, and the next PO will be ${last+1}. The numbers shown below have moved on, so copy your POs before changing the plan.`;
      save();render();toast('Order saved');return}
    case 'sel-prod':ui.sel=d.id;ui.newMat=false;ui.paste=false;break;
    case 'prod-add':{const n={id:uid(),name:'New product',unit:'pcs',lines:[]};S.products.push(n);ui.sel=n.id;break}
    case 'prod-dup':{const n=JSON.parse(JSON.stringify(p));n.id=uid();n.name=p.name+' (copy)';S.products.push(n);ui.sel=n.id;break}
    case 'prod-del':if(!arm('prod-'+p.id))return;S.products=S.products.filter(x=>x.id!==p.id);S.plan.rows=S.plan.rows.filter(r=>r.productId!==p.id);ui.sel=null;ui.armed=null;break;
    case 'line-add':{const used=new Set(p.lines.map(l=>l.materialId));const m=S.materials.find(x=>!used.has(x.id))||S.materials[0];p.lines.push({materialId:m.id,length:'',weight:'',wastage:0});break}
    case 'line-del':p.lines.splice(+d.i,1);break;
    case 'paste-open':ui.paste=true;ui.newMat=false;render();$('#bm-paste')?.focus();return;
    case 'paste-cancel':ui.paste=false;break;
    case 'paste-read':{const rows=parseBOM($('#bm-paste').value);if(!rows.length){toast('No BOM rows found. Copy the cells straight from Excel and paste again.');return}
      let tgt=p;if(!tgt){tgt={id:uid(),name:'Pasted BOM',unit:'pcs',lines:[]};S.products.push(tgt);ui.sel=tgt.id}
      if($('#bm-replace').checked)tgt.lines=[];let made=0;
      for(const r of rows){let m=matchMat(r);
        if(!m){m={id:uid(),name:r.name.replace(/\b\w+/g,w=>w.length>3?w[0].toUpperCase()+w.slice(1).toLowerCase():w),gsm:r.gsm?String(r.gsm):'',width:r.width?String(r.width):'',type:'',remark:'',unit:'KG',vendorId:'',rate:0,opening:0};S.materials.push(m);made++}
        tgt.lines.push(r.gsm?{materialId:m.id,length:r.length,weight:'',wastage:0}:{materialId:m.id,length:'',weight:r.weight,wastage:0});}
      ui.paste=false;save();render();toast(`${rows.length} rows read, ${made} new material${made===1?'':'s'} added. Total ${fmt(pcGrams(tgt),4)} g per piece.`);return}
    case 'newmat-open':ui.newMat=true;ui.paste=false;render();$('#bm-name')?.focus();return;
    case 'newmat-open-tab':ui.newMatTab=true;render();$('#mt-name')?.focus();return;
    case 'newmat-cancel':ui.newMat=false;ui.newMatTab=false;break;
    case 'newmat-save':{const px=d.px;const g=k=>$('#'+px+'-'+k)?.value??'';
      if(!g('name').trim()){const er=$('#'+px+'-err');er.textContent='Give the material a name.';er.hidden=false;$('#'+px+'-name').focus();return}
      const m={id:uid(),name:g('name').trim(),gsm:g('gsm').trim(),width:g('width').trim(),type:g('type').trim(),remark:g('remark').trim(),unit:g('unit'),vendorId:g('vendor'),rate:num(g('rate')),opening:num(g('opening'))};
      S.materials.push(m);
      if(px==='bm'&&p){p.lines.push({materialId:m.id,length:g('length')===''?'':num(g('length')),weight:g('weight')===''?'':num(g('weight')),wastage:num(g('wastage'))});ui.newMat=false}else ui.newMatTab=false;
      toast(`${m.name} added`);break}
    case 'mat-del':if(!arm('mat-'+d.id))return;S.materials=S.materials.filter(m=>m.id!==d.id);delete S.plan.overrides[d.id];ui.armed=null;break;
    case 'ven-add':S.vendors.push({id:uid(),name:'NEW VENDOR',address:'',gstin:'',state:'',delivery:'',payment:''});break;
    case 'ven-del':if(!arm('ven-'+d.id))return;S.vendors=S.vendors.filter(v=>v.id!==d.id);ui.armed=null;break;
    case 'bk-copy':{const t=backupText();try{await navigator.clipboard.writeText(t);toast('Backup copied. Paste it into a note or email to keep it safe.')}catch(err){const ta=$('#bk-in');ta.value=t;ta.select();toast('Select-all and copy the backup from the box below.')}return}
    case 'bk-dl':{const b=new Blob([backupText()],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=`rm-ordering-backup-${today()}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
    case 'bk-restore':{if(!isAdmin()){toast('Only the admin can restore a backup.');return}try{const nx=migrate(JSON.parse($('#bk-in').value));if(!nx.users.length)nx.users=S.users;S=nx;save();ui.sel=null;render();toast('Backup restored')}catch(err){toast('Could not restore: '+(err.message||'the text is not a valid backup'))}return}
    case 'reset':if(!isAdmin())return;if(!arm('reset'))return;{const keep=S.users;S=seed();S.users=keep}ui.armed=null;ui.sel=null;ui.saved=null;save();toast('Reset to example data');break;
    default:return;
  }
  save();render();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='gate-form')return;e.preventDefault();
  const user=$('#g-user').value.trim().toLowerCase(),pin=$('#g-pin').value.trim();
  const fail=m=>{auth.err=m;render();$('#g-user').value=user};
  if(!S.users.length){
    if(!USER_RE.test(user))return fail('Username must be 2–20 letters or numbers (dot, dash and underscore allowed).');
    if(!PIN_RE.test(pin))return fail('PIN must be 4 to 6 digits.');
    if(pin!==$('#g-pin2').value.trim())return fail('The two PINs do not match.');
    const u=makeUser(user,pin,'admin');S.users.push(u);save();setMe(u.id);auth.err='';render();toast('Admin login created');return;
  }
  const now=Date.now();
  if(now<auth.until)return fail(`Too many wrong tries. Try again in ${Math.ceil((auth.until-now)/1000)} seconds.`);
  const u=S.users.find(x=>x.username===user);
  if(!u||pinHash(u.salt,pin)!==u.hash){auth.fails++;if(auth.fails>=5){auth.until=now+60000;auth.fails=0;return fail('Too many wrong tries. Wait 1 minute and try again.')}return fail('Username or PIN is wrong.')}
  auth.fails=0;auth.err='';setMe(u.id);render();
});
window.addEventListener('hashchange',()=>{ui.armed=null;render();window.scrollTo(0,0)});
render();
})();
</script>
